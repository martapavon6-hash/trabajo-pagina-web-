<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título de mi Página</title>
    <style>
        body {
            background-color: pink; /* Fondo rosa */
            color: white;           /* Texto en blanco */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Contenedor responsivo para el vídeo */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            margin-top: 30px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <h1>¡Hola, mundo!</h1>
    <h2>Marta Pavón Muñoz</h2>
    <p>Este es el contenido visible de mi sitio web.</p>

    <!-- Vídeo incrustado al final -->
    <div class="video-container">
        <iframe 
            src="https://www.youtube.com/embed/RtWGVlo-HzU" 
            title="Reproductor de vídeo de YouTube" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
